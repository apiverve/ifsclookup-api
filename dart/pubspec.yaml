name: apiverve_ifsclookup
description: "IFSC Lookup is an IFSC code search API that verifies Indian bank branch details from any IFSC code, returning the bank name, branch, street address, city, district and state, plus the state's ISO code and the bank and branch codes. Paid plans add MICR, SWIFT and the NEFT, RTGS, IMPS and UPI flags."
version: 1.2.4
homepage: https://apiverve.com/marketplace/ifsclookup?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/ifsclookup-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
